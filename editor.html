<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CuePilot Editor</title>
    <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
    <main class="editor-layout" aria-label="Course editor">
        <header class="editor-header">
            <div class="editor-title-group">
                <p class="editor-eyebrow">Course Editor</p>
                <h1 id="editor-course-title">Loading course...</h1>
            </div>
            <div class="editor-header-meta">
                <span id="editor-total-segments">-- segments</span>
                <span id="editor-total-duration">--</span>
            </div>
            <a class="editor-back-link editor-btn" href="/" aria-label="Back to course listing">&larr; Back to Courses</a>
        </header>

        <section class="editor-content" aria-label="Editor workspace">
            <!-- LEFT PANEL: Timeline -->
            <div id="editor-timeline" class="editor-panel editor-timeline" aria-label="Timeline canvas">
                <div class="editor-panel-header">
                    <h2>Timeline</h2>
                    <div class="editor-panel-actions" aria-label="Timeline quick actions">
                        <button type="button" class="editor-btn" disabled>+ Add Segment</button>
                        <button type="button" class="editor-btn" disabled>+ Add Break</button>
                    </div>
                </div>
                <div id="editor-segment-list" class="editor-segment-list"></div>
            </div>

            <!-- DIVIDER 1: Between Timeline and Info List -->
            <div
                id="editor-divider-1"
                class="editor-divider"
                role="separator"
                aria-orientation="vertical"
                aria-label="Resize timeline and info sections"
                aria-valuemin="20"
                aria-valuemax="50"
                aria-valuenow="28"
                tabindex="0"
            ></div>

            <!-- MIDDLE PANEL: Info Sections List -->
            <div id="editor-info-list" class="editor-panel editor-info-list" aria-label="Info sections for selected segment">
                <div class="editor-panel-header">
                    <h2>Info Sections</h2>
                    <div class="editor-panel-actions">
                        <button type="button" class="editor-btn" id="editor-add-info-btn" disabled>+ Add Section</button>
                    </div>
                </div>
                <div id="editor-info-sections" class="editor-info-sections"></div>
            </div>

            <!-- DIVIDER 2: Between Info List and Info Editor -->
            <div
                id="editor-divider-2"
                class="editor-divider"
                role="separator"
                aria-orientation="vertical"
                aria-label="Resize info sections and editor"
                aria-valuemin="20"
                aria-valuemax="50"
                aria-valuenow="36"
                tabindex="0"
            ></div>

            <!-- RIGHT PANEL: Info Section Editor -->
            <aside id="editor-info-editor" class="editor-panel editor-info-editor" aria-label="Edit selected info section">
                <div class="editor-panel-header">
                    <h2>Edit Info Section</h2>
                    <div class="editor-panel-actions editor-panel-actions-placeholder" aria-hidden="true">
                        <button type="button" class="editor-btn" tabindex="-1">+ Add Section</button>
                    </div>
                </div>
                <div id="editor-info-editor-content" class="editor-info-editor-content"></div>
            </aside>
        </section>

        <footer class="editor-footer" aria-label="Editor actions">
            <div class="editor-footer-left">Keyboard: Up/Down select segment</div>
            <div class="editor-footer-right">
                <button type="button" class="editor-btn" disabled>Preview Rehearsal</button>
                <a id="editor-run-link" class="editor-btn editor-btn-primary" href="/">Run Timer</a>
            </div>
        </footer>
    </main>

    <script type="module" src="/src/editor.ts"></script>
</body>
</html>
