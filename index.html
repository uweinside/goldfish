<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CuePilot</title>
    <link rel="stylesheet" href="/css/site.css" />
    <script>
        if (new URLSearchParams(window.location.search).get('from') === 'editor') {
            document.documentElement.classList.add('skip-start-splash');
        }
    </script>
</head>
<body class="start-splash-active">
    <div id="startup-splash" class="start-splash" role="status" aria-live="polite" aria-label="CuePilot is loading">
        <div class="start-splash-card">
            <img id="startup-splash-logo" class="start-splash-logo" src="" alt="CuePilot logo" />
            <h1 class="start-splash-title"><span class="app-title-accent">Cue</span>Pilot</h1>
            <p class="start-splash-tagline">Stay in flow. Stay on time.</p>
        </div>
    </div>
    <main class="start-layout">
        <div class="start-header">
            <h1 class="app-title"><span class="app-title-accent">Cue</span>Pilot</h1>
            <p class="app-subtitle">Select a course to begin</p>
        </div>
        <section id="local-courses-section" class="local-courses-section" hidden>
            <div class="local-courses-header">
                <h2 class="local-courses-title">My Courses</h2>
                <button type="button" id="new-course-btn" class="editor-btn editor-btn-primary">+ New Course</button>
            </div>
            <div id="local-course-grid" class="local-course-grid course-grid"></div>
        </section>
        <div id="github-courses-label" class="start-section-label" hidden>From GitHub</div>
        <div id="course-grid" class="course-grid">
            <div class="course-card course-card-skeleton" aria-hidden="true"><div class="skeleton-line skeleton-code"></div><div class="skeleton-line skeleton-title"></div><div class="skeleton-line skeleton-meta"></div></div>
            <div class="course-card course-card-skeleton" aria-hidden="true"><div class="skeleton-line skeleton-code"></div><div class="skeleton-line skeleton-title"></div><div class="skeleton-line skeleton-meta"></div></div>
            <div class="course-card course-card-skeleton" aria-hidden="true"><div class="skeleton-line skeleton-code"></div><div class="skeleton-line skeleton-title"></div><div class="skeleton-line skeleton-meta"></div></div>
            <div class="course-card course-card-skeleton" aria-hidden="true"><div class="skeleton-line skeleton-code"></div><div class="skeleton-line skeleton-title"></div><div class="skeleton-line skeleton-meta"></div></div>
            <div class="course-card course-card-skeleton" aria-hidden="true"><div class="skeleton-line skeleton-code"></div><div class="skeleton-line skeleton-title"></div><div class="skeleton-line skeleton-meta"></div></div>
            <div class="course-card course-card-skeleton" aria-hidden="true"><div class="skeleton-line skeleton-code"></div><div class="skeleton-line skeleton-title"></div><div class="skeleton-line skeleton-meta"></div></div>
        </div>
        <div id="pagination-controls" class="pagination-controls"></div>
        <footer class="start-footer">&copy; 2026 by Uwe Baumann</footer>
    </main>
    <script type="module" src="/src/start.ts"></script>
</body>
</html>
